<!doctype html>
<html lang="en">
<head>
  <script>
    // Old avalonrpg.net addresses. On Apache, public/.htaccess answers these with a 301; GitHub
    // Pages has no redirects, so they land here and are forwarded before anything renders.
    (function () {
      var p = location.pathname.replace(/\/+$/, '');
      var pages = {
        '/index.php': '/', '/avalon-story.php': '/story/', '/avalon-characters.php': '/characters/',
        '/avalon-music.php': '/music/', '/avalon-screens.php': '/media/#classic',
        '/avalon-movie.php': '/media/#classic', '/avalon-download.php': '/original/#download',
        '/avalon-awards.php': '/original/#awards', '/avalon-reviews.php': '/original/#reviews',
        '/avalon-walkthrough.php': '/original/guide/', '/avalon-remake.php': '/original/',
        '/avalon-links.php': '/original/#links', '/contact.php': '/contact/'
      };
      var to = pages[p];
      if (!to && /^\/(downloads|mp3|images)\//.test(p)) to = '/classic' + location.pathname;
      if (to) location.replace(to);
    })();
  </script>
  <!-- @include head -->
  <title>Page not found — Avalon</title>
  <meta name="robots" content="noindex" />
</head>
<body data-page="404">
  <!-- @include header -->
  <main id="main">
    <section class="section">
      <div class="container" style="max-width: 820px">
        <div class="panel-dialogue">
          <div class="speech">
            <img class="speech-portrait" src="/game/portraits/mace-surprised.webp" width="256" height="256" alt="" />
            <div>
              <span class="speech-name">Mace</span>
              <h1 style="font-size: 28px">Hmm… this path leads nowhere.</h1>
              <p>The page you're looking for isn't here. Maybe a monster ate it. Let's head back to the village.</p>
              <div class="btn-row">
                <a class="plate plate-primary" href="/">Back to the village</a>
                <a class="plate" href="/original/">The original 1998 game</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <!-- @include footer -->
</body>
</html>
